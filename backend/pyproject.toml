[project]
name = "flatflix-portal"
version = "0.1.0"
description = "Flatflix portal backend: search and download via qBittorrent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "pydantic-settings==2.16.1",
    "itsdangerous==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real qBittorrent reachable at QBIT_TEST_URL",
    "sandbox: needs the running stack with a working /dev/kvm (SANDBOX_TEST=1)",
]
addopts = "-m 'not integration and not sandbox'"

[tool.ruff]
line-length = 100
target-version = "py312"
