# Flatflix stack. The one port map and the media-folder contract live in
# docs/ports-and-media.md; keep this file in line with it.
name: flatflix

# D-40: logs go to stdout only and Docker rotates them (10 MB x 5 files per container);
# read them with `docker compose logs backend`. Docker's defaults are unlimited size, one file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: "8088"
      TORRENTING_PORT: "6881"
      QBITTORRENT_USER: ${QBITTORRENT_USER:?set QBITTORRENT_USER in .env}
      QBITTORRENT_PASS: ${QBITTORRENT_PASS:?set QBITTORRENT_PASS in .env}
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/custom-cont-init.d:/custom-cont-init.d:ro
      # One bind for the whole data tree (media, quarantine, rejected, incomplete): QUAR-01, D-44.
      - type: bind
        source: ${DATA_ROOT:-./data}
        target: /data
        bind:
          create_host_path: false
    networks: [qbit]
    # TCP check only: the API answers 403 when unauthenticated.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8088"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./backend
    env_file: .env
    # link() of qBittorrent's files into the media folders needs the owner's uid under
    # fs.protected_hardlinks (RESEARCH Pitfall 6).
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # The same single bind as qbittorrent: two separate binds would make link() fail with a
      # cross-device error (RESEARCH Pitfall 6).
      - type: bind
        source: ${DATA_ROOT:-./data}
        target: /data
        bind:
          create_host_path: false
    # `sandbox` is the internal network shared with the runner (D-68). The backend does NOT
    # depend_on the sandbox: a stopped sandbox leaves rows in Checking and never stops the
    # portal (D-58).
    networks: [edge, qbit, sandbox]
    depends_on:
      qbittorrent:
        condition: service_healthy
    # Liveness of the backend process: /api/health answers 200 even when degraded.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # The microVM runner (QUAR-02, D-68, D-71 amended: no jailer, the hardened container is the
  # jail). It has no authentication, so it sits on the internal `sandbox` network only, with
  # no published port. It sees only the quarantine folder, read-only, and none of the portal's
  # secrets (no env_file). Firecracker keeps its own seccomp filter and Docker's default
  # seccomp profile stays on.
  sandbox:
    build: ./sandbox
    user: "10002:10002"
    # /dev/kvm is root:<kvm group>; scripts/init-host-dirs.sh writes the group id as KVM_GID.
    group_add: ["${KVM_GID:?set KVM_GID in .env: run scripts/init-host-dirs.sh}"]
    devices: ["/dev/kvm:/dev/kvm"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 768m
    tmpfs:
      - /run/fx:size=16m,mode=0700,uid=10002,gid=10002
      - /tmp:size=8m
    environment:
      QUARANTINE_ROOT: /data/quarantine
      VM_VCPUS: ${VM_VCPUS:-1}
      VM_MEMORY_MIB: ${VM_MEMORY_MIB:-256}
      VM_TIMEOUT_SECONDS: ${VM_TIMEOUT_SECONDS:-60}
    volumes:
      # The quarantine folder only, read-only: not media, rejected or incomplete.
      - type: bind
        source: ${DATA_ROOT:-./data}/quarantine
        target: /data/quarantine
        read_only: true
        bind:
          create_host_path: false
    networks: [sandbox]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    # The ONLY published port of the stack (D-04).
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

networks:
  # Backend and the web service only.
  edge: {}
  # Not internal: search plugins and peers need Internet egress.
  qbit: {}
  # No Internet and no other service: the backend and the sandbox only (D-68). Docker's
  # `internal` flag also means a port published on it would not be reachable, so tests reach
  # the runner through `docker compose exec backend`.
  sandbox:
    internal: true
